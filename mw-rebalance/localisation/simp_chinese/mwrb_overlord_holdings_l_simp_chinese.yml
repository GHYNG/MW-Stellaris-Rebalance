l_simp_chinese:
  holding_mwrb_imperial_palace: "帝国行宫"
  holding_mwrb_imperial_palace_desc: "帝国行宫是帝国皇帝在附庸国的宫殿，它行使着加强宗主国与附庸国交流的功能。即使皇帝本人不在，帝国官僚们也在这里夜以继日地与本地管理者们进行交流。\n而皇帝本人在场时，这里将取代附庸国政府，成为该国真正的政治中心。"
  holding_garrison_armies_desc: "这个行星上驻扎的每一支来自宗主国的陆军都给予额外的§G-10%§![Root.CrimeOrDeviancy]、§G+0.5§!$r_loyalty$以及§R-5%§!幸福度。"
  holding_propaganda_office: "真理科"
  holding_propaganda_office_desc: "一个监管当地信仰和政治性团体的科级部门。在恰当的督促下，一切都运行得更加顺畅。"
  holding_propaganda_office_1: "真理处"
  holding_propaganda_office_1_desc: "一个监管当地信仰和政治性团体的处级部门。更高的行政级别可以调用更多的政治资源。"
  holding_propaganda_office_2: "真理厅"
  holding_propaganda_office_2_desc: "一个监管当地信仰和政治性团体的厅级部门。提升到厅级的该部门可以调用更多宗主国的行政资源，用于实现宗主国的议程。"
  holding_propaganda_office_3: "真理部"
  holding_propaganda_office_3_desc: "一个监管当地信仰和政治性团体的厅级部门。由部级官员直接出任的驻附庸国真理部可以调用全宗主国的资源来与之配合。"
